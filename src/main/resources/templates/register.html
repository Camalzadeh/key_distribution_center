<!DOCTYPE html>
<!--/*
  Sign in and sign up are one form, because the endpoint is: an unknown
  username is registered and a key pair generated, a known one is
  authenticated. The page says so rather than leaving the reader to discover
  it by typing the wrong thing.
*/-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>

<button class="icon-btn theme-float" type="button" data-theme-toggle aria-label="Switch theme">
  <i class="fas fa-moon"></i>
</button>

<main class="solo">
  <div class="solo__card rise">
    <div class="solo__brand">
      <span class="brand__mark"><i class="fas fa-key"></i></span>
      <div>
        <h1 class="solo__title">Key Distribution Center</h1>
        <p class="solo__sub">Sign in, or pick a name to register</p>
      </div>
    </div>

    <!--/*
      Inline feedback. The old page used alert() for every outcome, including
      success — a modal dialog that blocked the redirect until dismissed.
    */-->
    <div id="auth-note" class="alert-k form-note" aria-live="polite">
      <i class="fas fa-circle-exclamation"></i>
      <span id="auth-note-text"></span>
    </div>

    <form id="auth-form" novalidate>
      <div class="field">
        <label class="field__label" for="username">Username</label>
        <div class="input-icon">
          <i class="fas fa-at"></i>
          <input class="form-control" type="text" id="username" name="username"
                 autocomplete="username" autocapitalize="none" spellcheck="false"
                 placeholder="humbat" required>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input class="form-control" type="password" id="password" name="password"
                 autocomplete="current-password" placeholder="••••••••" required>
        </div>
      </div>

      <button class="btn-k btn-k--primary btn-k--block btn-k--lg" type="submit" id="auth-submit">
        <i class="fas fa-arrow-right-to-bracket"></i> Continue
      </button>
    </form>

    <p class="solo__note">
      A username that does not exist yet is created, and an RSA key pair is generated for it
      immediately. An existing one is signed in.
    </p>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
