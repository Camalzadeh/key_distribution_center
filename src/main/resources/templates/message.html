<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Send Message')"></head>
<body>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main">
        <div th:replace="fragments/navbar :: navbar"></div>

        <div class="container-fluid-custom animate-fade-in">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="glass-card">
                        <div class="text-center mb-5">
                            <i class="fas fa-paper-plane fa-3x text-primary mb-3"></i>
                            <h2 class="fw-bold">Secure Messenger</h2>
                            <p class="text-muted">Compose and encrypt your message locally before transmission.</p>
                        </div>

                        <form th:action="@{/message/send}" method="post">
                            <div class="row">
                                <div class="col-md-12 mb-4">
                                    <label for="receiverId" class="form-label">Recipient</label>
                                    <select id="receiverId" name="receiverId" class="form-select form-control" required>
                                        <option disabled selected value="">-- Select a recipient --</option>
                                        <option th:each="u : ${users}"
                                                th:value="${u.id}"
                                                th:text="'@' + ${u.username} + ' (Key: ' + ${#strings.substring(u.publicKey, 0, 15)} + '...)'">
                                        </option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label for="algorithm" class="form-label">Encryption Algorithm</label>
                                    <select id="algorithm" name="algorithm" class="form-select form-control" required>
                                        <option value="Caesar">Basic Caesar</option>
                                        <option value="Vigenere" selected>Advanced Vigenere</option>
                                        <option value="Playfair">Playfair Matrix</option>
                                        <option value="Railfence">Railfence Transposition</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label for="blockMode" class="form-label">Block Operation Mode</label>
                                    <select id="blockMode" name="blockMode" class="form-select form-control" required>
                                        <option value="None">None</option>
                                        <option value="ECB">ECB (Electronic Codebook)</option>
                                        <option value="CBC">CBC (Cipher Block Chaining)</option>
                                        <option value="CFB">CFB (Cipher Feedback)</option>
                                        <option value="OFB">OFB (Output Feedback)</option>
                                    </select>
                                </div>

                                <div class="col-md-12 mb-4">
                                    <label for="key" class="form-label">Symmetric Key</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-key text-muted"></i></span>
                                        <input type="text" id="key" name="key" class="form-control border-start-0" placeholder="e.g. MYSECRETKEY" required>
                                    </div>
                                    <div class="form-text mt-2 small">This key will be encrypted with the recipient's public RSA key.</div>
                                </div>

                                <div class="col-md-12 mb-4">
                                    <label for="content" class="form-label">Message Content</label>
                                    <textarea id="content" name="content" class="form-control" rows="4" placeholder="Type your confidential message here..." required></textarea>
                                </div>

                                <div class="col-md-12">
                                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold">
                                        <i class="fas fa-lock me-2"></i> Encrypt & Send
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <footer class="mt-5 text-center">
                <p class="mb-0">Secure Key Distribution & Messaging</p>
                <small>Humbat Jamalov | Asim Gasimov | Yunis Kangarli</small>
            </footer>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const algorithmSelect = document.getElementById('algorithm');
        const blockModeSelect = document.getElementById('blockMode');

        function updateBlockMode() {
            const algo = algorithmSelect.value;

            const shouldDisable = (algo === 'Playfair' || algo === 'Railfence');
            blockModeSelect.disabled = shouldDisable;

            if (shouldDisable) {
                blockModeSelect.value = 'None';
            }
        }

        algorithmSelect.addEventListener('change', updateBlockMode);
        updateBlockMode();
    });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
