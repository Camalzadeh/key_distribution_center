<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Encrypt')}"></head>
<body>

<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container-fluid-custom animate-fade-in">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="glass-card mb-4">
                        <div class="text-center mb-5">
                            <i class="fas fa-file-shield fa-3x text-primary mb-3"></i>
                            <h2 class="fw-bold">Encryption Factory</h2>
                            <p class="text-muted">Direct symmetric encryption utility with multiple block modes.</p>
                        </div>

                        <form th:action="@{/encrypt/process}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label for="algorithm" class="form-label">Cipher Engine</label>
                                    <select class="form-select form-control" id="algorithm" name="algorithm" required>
                                        <option value="Caesar">Standard Caesar</option>
                                        <option value="Vigenere" selected>Polyalphabetic Vigenere</option>
                                        <option value="Playfair">Playfair Matrix</option>
                                        <option value="Railfence">Railfence Transposition</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label for="mode" class="form-label">Operating Mode</label>
                                    <select class="form-select form-control" id="mode" name="mode" required>
                                        <option value="ECB">ECB Mode</option>
                                        <option value="CBC">CBC Mode</option>
                                        <option value="CFB">CFB Mode</option>
                                        <option value="OFB">OFB Mode</option>
                                        <option value="NONE">No Block Mode</option>
                                    </select>
                                </div>

                                <div class="col-md-12 mb-4">
                                    <label for="key" class="form-label">Symmetric Key</label>
                                    <input type="text" class="form-control" id="key" name="key" placeholder="Enter encryption key..." required>
                                </div>

                                <div class="col-md-12 mb-4">
                                    <label for="text" class="form-label">Plaintext Input</label>
                                    <textarea class="form-control" id="text" name="text" rows="4" placeholder="Enter message to encrypt..." required></textarea>
                                </div>

                                <div class="col-md-12">
                                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold">
                                        Generate Ciphertext <i class="fas fa-lock ms-2"></i>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div th:if="${encryptedText != null}" class="glass-card border-success border-opacity-25 animate-fade-in">
                        <h5 class="text-success mb-3 fw-bold"><i class="fas fa-check-circle me-2"></i> Encryption Successful</h5>
                        <label class="small text-muted mb-2">Resulting Ciphertext:</label>
                        <textarea class="form-control bg-dark text-success font-monospace" rows="4" readonly th:text="${encryptedText}"></textarea>
                        <div class="mt-3 text-end">
                            <button class="btn btn-sm btn-link text-success text-decoration-none" onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.value)">
                                <i class="fas fa-copy me-1"></i> Copy to Clipboard
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-5 text-center">
                <p class="mb-0">Secure Key Distribution & Messaging</p>
                <small>Humbat Jamalov | Asim Gasimov | Yunis Kangarli</small>
            </footer>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const algo = document.getElementById("algorithm");
        const mode = document.getElementById("mode");

        function updateModeAvailability() {
            const selected = algo.value;
            const isBlockSupported = (selected === "Caesar" || selected === "Vigenere");
            mode.disabled = !isBlockSupported;
            if (!isBlockSupported) {
                mode.value = "NONE";
            }
        }

        algo.addEventListener("change", updateModeAvailability);
        updateModeAvailability(); // on load
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
