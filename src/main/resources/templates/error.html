<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="css/error.css" rel="stylesheet">
</head>
<body>
<div class="container animate-fade-in">
    <i class="fas fa-triangle-exclamation fa-5x text-danger mb-5"></i>
    <h1 class="display-1 fw-black">Oops!</h1>

    <!-- Status-specific messages -->
    <div class="mb-5">
        <h4 th:if="${status == 404}" class="text-muted">The requested page was not found.</h4>
        <h4 th:if="${status == 500}" class="text-muted">A server disruption occurred. Our team is aware.</h4>
        <h4 th:if="${status == 401}" class="text-muted">Security clearance required for this sector.</h4>
        <h4 th:if="${status != 404 and status != 500 and status != 401}" class="text-muted">
            An unexpected error occurred.
        </h4>
        <p class="code mt-3">
             Error Protocol: <span th:text="${status}">Unknown Error Code</span>
        </p>
    </div>

    <a href="/" class="btn-primary rounded-pill px-5 shadow-lg">Return to Base</a>
</div>
</body>
</html>
