spring.application.name=key-distribution-center

# --- database -----------------------------------------------------------------
# Every value comes from the environment. The password has NO default on
# purpose: a fallback password in a tracked file is a published password, and
# the one that used to sit here was the real one. Without it set, startup fails
# loudly instead of quietly connecting as something unintended.
#
# For local work, copy .env.example to .env and let compose read it.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kdc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database=postgresql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate applies the schema at startup. That makes container start-up the
# migration step, so there is nothing for a deployment pipeline to run
# separately -- and it also means a schema change happens before anything can
# review it. Take the backup first.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# SQL logging is off by default now. It was on, which writes every statement of
# every request to stdout -- in a container that is the log driver's problem,
# and the statements carry column values.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# --- web ----------------------------------------------------------------------
server.error.whitelabel.enabled=false
spring.thymeleaf.check-template-location=true
spring.web.resources.add-mappings=true

# Behind a TLS-terminating reverse proxy the application sees plain HTTP. This
# makes Spring honour X-Forwarded-Proto and X-Forwarded-For, so redirects keep
# the https scheme and logs show the real client address.
server.forward-headers-strategy=framework

# The SESSION_ID cookie is built by AuthController, not by the servlet
# container, so `server.servlet.session.cookie.*` would have no effect here --
# this is the flag the code actually reads. Secure by default; set it to false
# only for plain-HTTP local work, where a browser discards a Secure cookie and
# the login appears to succeed without ever sticking.
app.cookie.secure=${COOKIE_SECURE:true}

session.ttl.hours=${SESSION_TTL_HOURS:12}

# --- health -------------------------------------------------------------------
# Actuator listens on its OWN port, which the reverse proxy does not forward.
# Two things follow from that: the health endpoint is reachable from inside the
# container (the image's HEALTHCHECK uses it) and from nowhere else, and the
# management context is a child context, so the application's session filter
# never runs against it.
#
# `show-details=never` keeps the response to {"status":"UP"} -- no component
# names, no database URL. UP still requires a live connection from the pool, so
# it is a real round trip and not just "the process is alive".
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
